# Nginx inside the web container: serves the built SPA and proxies /api/ to
# the backend service over the private Compose network.
#
# This terminates no TLS and is published on loopback only. The host proxy in
# front of it owns HTTPS, the certificate and the public origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Keep personal search terms out of access logs, including SPA deep links.
    access_log off;

    # One above the 10 MiB import limit, to leave room for multipart overhead.
    client_max_body_size 11m;
    client_body_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location /api/ {
        # Search query strings can contain personal names and identifiers.
        access_log off;

        # `backend` is the Compose service name, resolved on the private
        # network. Re-resolved per request so a container restart that changes
        # the address does not leave this worker caching a dead upstream.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:3000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Pass through the client address the host proxy established, rather
        # than replacing it with this container's gateway address. The backend
        # trusts exactly one hop, and its login rate limit is per client IP —
        # overwriting this would make that limit global to all users.
        #
        # This is only safe because the container is not publicly reachable.
        # Keep the loopback publish in docker-compose.yml.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;

        proxy_read_timeout 90s;
        proxy_hide_header X-Powered-By;
    }

    # Hashed assets are immutable; the HTML entry point never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: unknown paths render the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
