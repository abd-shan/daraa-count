# Host Nginx: the public HTTPS front door.
#
# It terminates TLS and forwards everything to the `web` container on
# 127.0.0.1:8080, which serves the built SPA and proxies /api to the backend.
# Nothing is served from the host filesystem any more — the frontend ships
# inside its image, so there is no `frontend/dist` to copy on each release.
#
# Replace census.example.invalid and the certificate paths before enabling.
# This file belongs in Nginx's http context, for example sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name census.example.invalid;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name census.example.invalid;
    ssl_certificate /etc/letsencrypt/live/census.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/census.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # URLs can contain census search terms, including SPA deep links.
    access_log off;
    # One above the 10 MiB import limit, to leave room for multipart overhead.
    client_max_body_size 11m;
    client_body_timeout 30s;
    send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # This is the single trusted hop that establishes the client address.
        # It REPLACES any incoming header, so a client cannot forge it, and
        # the container passes the value through untouched. The backend trusts
        # one hop and rate-limits login per client IP, so this assignment is
        # what keeps that limit per user rather than global.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 90s;
        proxy_hide_header X-Powered-By;
    }
}
